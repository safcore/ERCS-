# ==============================================================================
# SonarQube Project Configuration
# Project: Emergency Response Coordination System (ERCS)
# Student Roll No: 124BTCS1031 | DevSecOps Lab CIAP Microproject
# ==============================================================================

# Project Identification
sonar.projectKey=ERCS-DevSecOps
sonar.projectName=Emergency Response Coordination System
sonar.projectVersion=1.0.0

# Source Code Paths
sonar.sources=backend,frontend/src
sonar.tests=tests

# Encodings
sonar.sourceEncoding=UTF-8

# Exclusions (Third-party libraries, caches, builds, documentation, and database files)
sonar.exclusions=backend/venv/**,frontend/node_modules/**,frontend/dist/**,**/*.pyc,backend/ercs.db,terraform/**,docs/**,.pytest_cache/**

# Language Specific Configurations
sonar.python.version=3.12,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate Non-blocking check
sonar.qualitygate.wait=false
