# ==============================================================================
# ERCS Multi-Container Orchestration (Docker Compose)
# Emergency Response Coordination System (Roll No. 124BTCS1031)
# DevSecOps Practice: Isolated network, health checks, persistent volume
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ercs-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/ercs.db
    volumes:
      - ercs_sqlite_data:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:5000/api/system/health').getcode() == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ercs-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ercs-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ercs-net

volumes:
  ercs_sqlite_data:
    name: ercs_sqlite_volume

networks:
  ercs-net:
    name: ercs_internal_network
    driver: bridge
